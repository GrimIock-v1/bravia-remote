name: Build, test and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/grimiock-v1/bravia-remote

jobs:
  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: App tests against simulated TV
        run: python3 tests/test_remote.py

  test-container:
    needs: test-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64) for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bravia-remote:ci
      - name: Run container like Unraid does (host network, root-owned appdata)
        run: |
          sudo mkdir -p /tmp/appdata && sudo chown root:root /tmp/appdata
          docker run -d --name br --network host \
            -e TV_IP=127.0.0.1:8099 -e PORT=8790 \
            -v /tmp/appdata:/config bravia-remote:ci
      - name: Full test suite against the running container
        run: python3 tests/test_remote.py --external http://127.0.0.1:8790 --mock-port 8099
      - name: Pairing was saved to appdata, app runs as 99:100
        run: |
          sudo test -s /tmp/appdata/bravia_remote.json
          sudo grep -q '"cookie": "auth=GOOD"' /tmp/appdata/bravia_remote.json
          docker exec br grep -E '^Uid:\s+99\s' /proc/1/status
          stat -c '%u:%g' /tmp/appdata/bravia_remote.json | grep -qx '99:100'
      - name: Healthcheck reports healthy
        run: |
          for i in $(seq 1 20); do
            s=$(docker inspect -f '{{.State.Health.Status}}' br); echo "$s"
            [ "$s" = healthy ] && exit 0; sleep 3
          done; exit 1
      - name: Container logs
        if: always()
        run: docker logs br

  publish:
    needs: test-container
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
